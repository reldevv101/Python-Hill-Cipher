[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hill-cipher-benchmark"
version = "0.1.0"
description = "Educational Hill Cipher benchmark with sequential, multiprocessing, and MPI implementations"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
distributed = ["mpi4py>=4.0"]

[project.scripts]
hill-cipher-mpi = "hill_cipher_benchmark.mpi_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
